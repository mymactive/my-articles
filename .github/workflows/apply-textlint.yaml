name: "Article checks"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  textlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Report writing suggestions (no automatic edits)
        shell: bash
        run: |
          status=0
          npm run lint -- --format github || status=$?
          # Existing prose is kept intact. Style findings are advisory, as with
          # the previous Danger setup; tool/configuration failures still fail CI.
          if [ "$status" -eq 1 ]; then
            echo "::warning::textlint reported writing suggestions. Review them before publishing."
          else
            exit "$status"
          fi
      - name: Verify checks did not modify tracked files
        run: git diff --exit-code
